<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик нажатий</title>
    <link rel="stylesheet" href="counter.css">
</head>
<body>
    <div class="column">
        <h1 class="title">СЧЕТЧИК НАЖАТИЙ</h1>
        <h2 class="counter" id="counter">0</h2>
        <div class="button"> 
            <button class="button__plus" id="button__plus">+</button>
            <button class="button__minus" id="button__minus">-</button>
        </div>
        <button class="button__null" id="button__null">Обнулить счет</button>
    </div>
    <script src="counter.js"></script>
</body>
</html>
